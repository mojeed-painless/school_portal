name: CI Workflow

on:
  push:
    branches: [ main, master, "refactor/*", "fix/*", "feat/*", "build/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Test Suite
        run: npm run test

      - name: Build Application
        run: npm run build
