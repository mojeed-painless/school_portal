version: '3.8'

services:
  school-portal-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_portal_frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
